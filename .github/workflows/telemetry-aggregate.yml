name: telemetry-aggregate

# Issue 当数据源：扫描带 `shell-family` label 的反馈 Issue，解析其中的机器可解析块，
# 幂等更新一个汇总 Issue。零服务端、零外部依赖。
on:
  schedule:
    # 每天 UTC 03:17（北京时间 11:17），避开整点高峰。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: telemetry-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parser self-test
        run: node .github/scripts/telemetry-aggregate.mjs --self-test > /dev/null

      - name: Aggregate feedback issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEMETRY_LABEL: shell-family
        run: node .github/scripts/telemetry-aggregate.mjs
