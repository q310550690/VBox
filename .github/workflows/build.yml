name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "编译哪些平台"
        type: choice
        options:
          - both
          - windows
          - macos
        default: both
      bundle:
        description: "Windows 内置哪些原生依赖：all / none / ffmpeg,python,node"
        required: false
        default: "all"
      tag:
        description: "发布 Tag（留空则不发 Release，例如 v0.1.0）"
        required: false
        default: ""
      notes:
        description: "Release 更新说明（留空则自动用提交记录）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

# 发布 Release 需要写权限
permissions:
  contents: write

# 同一分支/标签只保留最新一次构建，避免重复占用 runner
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  # 打包工具（NSIS / WiX / 下载缓存）由 Tauri 放在用户缓存目录
  TAURI_TOOLS_CACHE: |
    ~/AppData/Local/tauri
    ~/Library/Caches/tauri
    ~/.cache/tauri

jobs:
  windows:
    name: Windows NSIS
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'both' || inputs.platforms == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Windows Authenticode 代码签名：配置了 WINDOWS_CERTIFICATE secret 时导入 .pfx，
      # 把证书指纹写进 GITHUB_ENV，供 scripts/build.mjs 写入 bundle.windows.certificateThumbprint。
      # 没配时跳过（安装包不签名，Windows 会弹 SmartScreen，功能不受影响）。
      - name: Import Windows code signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host '未配置 WINDOWS_CERTIFICATE，跳过代码签名（安装包未签名）'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'vbox-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "已导入签名证书：$($cert.Thumbprint)"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 编译缓存（target + registry）
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: vbox-windows

      # Tauri 打包工具缓存（NSIS 等，不必每次重新下载）
      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ${{ env.TAURI_TOOLS_CACHE }}
          key: vbox-tauri-tools-${{ runner.os }}-v1
          restore-keys: vbox-tauri-tools-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ffmpeg / python / node / libmpv：只有脚本或内容变化时才重新下载
      - name: Cache bundled tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            .tools/cache
            src-tauri/resources/ffmpeg
            src-tauri/resources/python
            src-tauri/resources/node
            src-tauri/resources/libmpv-2.dll
          key: vbox-tools-${{ runner.os }}-${{ hashFiles('scripts/fetch-*.ps1') }}
          restore-keys: vbox-tools-${{ runner.os }}-

      # GitHub runner 直连 GitHub，不走 ghproxy 镜像
      - name: Fetch libmpv
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-libmpv.ps1 -ProxyPrefix ""

      - name: Build NSIS installer
        env:
          # 自动更新签名私钥（tauri signer generate 生成；配到仓库 secrets）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundle "${{ inputs.bundle || 'all' }}" --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: vbox-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      # 自动更新产物：Tauri v2 直接用安装包本体（.exe + .exe.sig）
      - uses: actions/upload-artifact@v4
        with:
          name: vbox-windows-updater
          path: |
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.zip.sig
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS .app/.dmg
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'both' || inputs.platforms == 'macos'
    runs-on: macos-latest
    timeout-minutes: 60
    # 放在 job 级 env：step 的 if 条件可以读取 env（secrets 不能直接写进 if）
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: vbox-macos

      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ${{ env.TAURI_TOOLS_CACHE }}
          key: vbox-tauri-tools-${{ runner.os }}-v1
          restore-keys: vbox-tauri-tools-${{ runner.os }}-

      # Homebrew 下载缓存（mpv + 依赖 bottle，避免每次重新下载）
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: vbox-homebrew-${{ runner.os }}-${{ hashFiles('scripts/fetch-libmpv-macos.sh') }}
          restore-keys: vbox-homebrew-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install libmpv (Homebrew)
        run: brew install mpv

      - name: Prepare bundled libmpv
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-libmpv-macos.sh

      # macOS 暂不内置 ffmpeg/python/node（只有 Windows 产物），走系统安装
      - name: Build .app
        env:
          # macOS 代码签名 / 公证（未配置时 Tauri 用 ad-hoc 签名）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:build -- --bundle none --bundles app

      - name: Bundle libmpv dylibs into .app
        run: ./scripts/bundle-runtime-macos.sh "src-tauri/target/release/bundle/macos/VBox.app"

      # 自动更新包：dylib 注入会改变 .app 内容，必须在这之后重新打包并签名，
      # 否则用户更新后播放器缺 dylib。未配置签名私钥时跳过（无自动更新）。
      - name: Create macOS updater artifact
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/macos
          rm -f VBox.app.tar.gz VBox.app.tar.gz.sig
          tar -czf VBox.app.tar.gz VBox.app
          APP_VERSION="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          npx tauri signer sign --app-version "$APP_VERSION" VBox.app.tar.gz
          ls -lh VBox.app.tar.gz VBox.app.tar.gz.sig

      - name: Package .app
        run: |
          ditto -c -k --keepParent "src-tauri/target/release/bundle/macos/VBox.app" "VBox-macos-app.zip"
          chmod +x scripts/*.sh
          ./scripts/package-dmg-macos.sh "src-tauri/target/release/bundle/macos/VBox.app" "VBox-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: vbox-macos
          path: |
            VBox-macos-app.zip
            VBox-macos.dmg
          if-no-files-found: error
          retention-days: 7

      # macOS 自动更新包（.app.tar.gz + .sig）：只在配置签名私钥时生成
      - uses: actions/upload-artifact@v4
        with:
          name: vbox-macos-updater
          path: |
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish Release
    needs: [windows, macos]
    # 任一平台构建成功，且是 tag 推送或手动填了 tag 时才发布
    if: |
      always() &&
      (needs.windows.result == 'success' || needs.macos.result == 'success') &&
      (github.event_name == 'push' || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vbox-*
          path: dist
          merge-multiple: true

      - name: Generate release notes (中文)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            commits="$(git log --no-merges --pretty=format:'- %s' "${prev_tag}..HEAD" | head -n 40 || true)"
            compare=""
          else
            commits="$(git log --no-merges --pretty=format:'- %s' -n 40 | head -n 40 || true)"
            compare=""
          fi
          {
            echo "## VBox ${TAG}"
            echo ""
            echo "构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "### 下载"
            echo ""
            if [ -n "$(ls dist/*.exe 2>/dev/null || true)" ]; then
              echo "- **Windows x64**：\`VBox_*_x64-setup.exe\`（默认内置 FFmpeg / Python / Node）"
            fi
            if [ -n "$(ls dist/*.dmg 2>/dev/null || true)" ]; then
              echo "- **macOS（Apple Silicon）**：\`VBox-macos.dmg\` 或 \`VBox-macos-app.zip\`"
            fi
            echo ""
            echo "### 更新内容"
            echo ""
            if [ -n "$NOTES" ]; then
              printf '%s\n' "$NOTES"
            elif [ -n "$commits" ]; then
              printf '%s\n' "$commits"
            else
              echo "- 常规构建"
            fi
            echo ""
            echo "### 安装说明"
            echo ""
            if [ -n "$(ls dist/*.exe 2>/dev/null || true)" ]; then
              echo "- Windows：运行安装包；若未配置代码签名，SmartScreen 会提示“更多信息 → 仍要运行”。"
              echo "- Windows 自动更新：已装旧版本的用户启动后会在「设置 → 关于」看到新版本并一键安装（配置签名密钥后生效）。"
            fi
            if [ -n "$(ls dist/*.dmg 2>/dev/null || true)" ]; then
              echo "- macOS：未配置开发者证书时为 ad-hoc 签名，首次打开如被拦截，请右键 App → 打开，或执行 \`xattr -dr com.apple.quarantine VBox.app\`。"
              echo "- macOS 版暂不内置 FFmpeg/Python/Node，按需自行安装或用系统版本。"
            fi
          } > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      # 生成自动更新清单：读取 dist 里的 .nsis.zip / .app.tar.gz 及其 .sig，
      # 输出 latest.json（客户端 updater 的 endpoint 指向上面的下载地址）。
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          UPDATE_NOTES: ${{ inputs.notes }}
        run: node scripts/latest-json.mjs --dist dist --out dist/latest.json

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: VBox ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*.sig
            dist/latest.json
          fail_on_unmatched_files: false
