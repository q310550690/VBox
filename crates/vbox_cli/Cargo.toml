[package]
name = "vbox_cli"
version = "0.1.2"
edition = "2021"
description = "VBox 核心引擎命令行验证工具（阶段0）"

[[bin]]
name = "vbox_cli"
path = "src/main.rs"

[dependencies]
vbox_core = { path = "../vbox_core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
